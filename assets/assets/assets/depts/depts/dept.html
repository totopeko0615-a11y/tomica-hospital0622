<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>診療科案内 | トミカ医科大学病院</title>
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="../assets/img/logo.png" alt="トミカ医科大学病院ロゴ">
        <div>
          <div class="brand-title">トミカ医科大学病院</div>
          <div class="brand-sub">TOMICA UNIVERSITY HOSPITAL</div>
        </div>
      </div>
      <nav class="nav">
        <a href="../index.html">ホーム</a>
        <a href="../schedule.html">外来診察予定表</a>
        <a href="../doctors.html">医師名簿</a>
        <a href="./index.html">診療科一覧</a>
      </nav>
    </div>
  </div>

  <main class="container">
    <section>
      <h2 id="title">診療科案内</h2>
      <p class="lead" id="lead"></p>

      <div class="grid grid-2">
        <div class="card">
          <h3>概要</h3>
          <p id="summary"></p>
          <div id="category"></div>
        </div>

        <div class="card">
          <h3>主な診療日・体制</h3>
          <ul class="list" id="schedulePoints"></ul>
        </div>

        <div class="card">
          <h3>担当医</h3>
          <ul class="list" id="doctors"></ul>
        </div>

        <div class="card">
          <h3>関連ページ</h3>
          <ul class="list">
            <li><a href="../schedule.html">外来診察予定表を見る</a></li>
            <li><a href="../doctors.html">医師名簿を見る</a></li>
            <li><a href="./index.html">診療科一覧へ戻る</a></li>
          </ul>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      © トミカ医科大学病院
    </div>
  </footer>

  <script src="../assets/departments.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const key = params.get('d');
    const dept = (window.DEPARTMENTS || []).find(x => x.key === key) || window.DEPARTMENTS[0];

    document.title = `${dept.title} | トミカ医科大学病院`;
    document.getElementById('title').textContent = dept.title;
    document.getElementById('lead').textContent = dept.pageLead;
    document.getElementById('summary').textContent = dept.summary;
    document.getElementById('category').innerHTML = `<span class="badge">${dept.category}</span>`;
    document.getElementById('schedulePoints').innerHTML = dept.schedulePoints.map(x => `<li>${x}</li>`).join('');
    document.getElementById('doctors').innerHTML = dept.doctors.map(x => `<li>${x}</li>`).join('');
  </script>
</body>
</html>
