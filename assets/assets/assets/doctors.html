<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>診療科一覧 | トミカ医科大学病院</title>
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="../assets/img/logo.png" alt="トミカ医科大学病院ロゴ">
        <div>
          <div class="brand-title">トミカ医科大学病院</div>
          <div class="brand-sub">TOMICA UNIVERSITY HOSPITAL</div>
        </div>
      </div>
      <nav class="nav">
        <a href="../index.html">ホーム</a>
        <a href="../schedule.html">外来診察予定表</a>
        <a href="../doctors.html">医師名簿</a>
        <a href="./index.html">診療科一覧</a>
      </nav>
    </div>
  </div>

  <main class="container">
    <section>
      <h2>診療科一覧</h2>
      <p class="lead">各診療科の案内ページです。</p>
      <div class="grid grid-3" id="deptList"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      © トミカ医科大学病院
    </div>
  </footer>

  <script src="../assets/departments.js"></script>
  <script>
    const list = document.getElementById('deptList');
    list.innerHTML = window.DEPARTMENTS.map(d => `
      <div class="card">
        <h3>${d.title}</h3>
        <p>${d.summary}</p>
        <div class="badge">${d.category}</div>
        <p style="margin-top:12px;">
          <a href="./dept.html?d=${encodeURIComponent(d.key)}">診療科ページへ</a>
        </p>
      </div>
    `).join('');
  </script>
</body>
</html>
